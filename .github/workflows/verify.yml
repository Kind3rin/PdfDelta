name: Verify PDF workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node audit-zero-cost.js
      - run: node --test verify-security.test.js verify-model.test.mjs verify-account.test.mjs
      - run: node verify-local.js
      - run: node scripts/report-output-verification.mjs
      - run: node verify-workspace.cjs
  browsers:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:browsers:install -- --with-deps ${{ matrix.browser }}
      - run: npm run test:browsers -- --project=${{ matrix.browser }}-desktop --project=${{ matrix.browser }}-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            dist/browser-results
            dist/browser-report
          retention-days: 14
  deploy:
    needs: [verify, browsers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package verified commit
        run: |
          mkdir -p dist/site
          git archive HEAD | tar -x -C dist/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
